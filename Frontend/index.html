<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校内失物招领 · 网页版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318181B'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>失</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/home">
      <span class="brand-badge">失</span>
      <span class="brand-name">校内失物招领</span>
    </a>
    <nav class="nav">
      <a href="#/home" data-nav="home">首页</a>
      <a href="#/search" data-nav="search">搜索</a>
      <a href="#/post" data-nav="post">发布</a>
      <a href="#/archive" data-nav="archive">废贴库</a>
    </nav>
    <div class="user-area" id="user-area"></div>
  </div>
</header>

<main class="page" id="app"></main>

<footer class="footer">校内互助 · 拾金不昧 · 文明交易</footer>

<!-- 登录/注册弹窗 -->
<div class="modal" id="auth-modal" hidden>
  <div class="modal-card">
    <button class="modal-close" id="auth-close" aria-label="关闭">×</button>
    <div class="modal-tabs">
      <button class="on" data-auth="login">登录</button>
      <button data-auth="register">注册</button>
    </div>
    <form id="auth-form" autocomplete="off">
      <label>用户名<input name="username" required minlength="3" maxlength="32" placeholder="字母 / 数字 / 汉字"></label>
      <label>密码<input name="password" type="password" required minlength="8" placeholder="至少 8 位"></label>
      <p class="form-hint" id="auth-hint"></p>
      <button class="btn-primary" type="submit" id="auth-submit">登录</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
